<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>立體方塊跑酷 - 10-Layer Cube Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: manipulation;
        }
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 900px;
            height: 100vh;
            max-height: 600px;
            background: #111827;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        .overlay.hidden {
            display: none;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
            text-align: center;
        }
        p.subtitle {
            color: #94a3b8;
            margin-bottom: 24px;
            font-size: 0.95rem;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 2px solid #334155;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }
        .btn.active {
            background: #0284c7;
            border-color: #38bdf8;
            color: #ffffff;
        }
        .start-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none;
            padding: 14px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.5);
            transition: 0.2s;
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(37, 99, 235, 0.7);
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            z-index: 5;
            pointer-events: none;
            font-family: monospace;
        }
        .hud-item {
            font-size: 1.15rem;
            font-weight: bold;
            color: #f8fafc;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 4px;
        }
        .hud-item span {
            color: #38bdf8;
        }
        #mobile-tip {
            position: absolute;
            bottom: 12px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: #64748b;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- 左上角資訊 -->
    <div id="hud">
        <div class="hud-item">時間：<span id="timeDisplay">00:00.0</span></div>
        <div class="hud-item">過關數：<span id="scoreDisplay">0</span></div>
    </div>
    <div id="mobile-tip">空白鍵 (Space) 或 點擊螢幕增加方塊墊高</div>

    <!-- 起始選單 -->
    <div id="startOverlay" class="overlay">
        <h1>立體 10 層跑酷</h1>
        <p class="subtitle">
            畫面共 10 層！按<b>空白鍵</b>或<b>點擊螢幕</b>墊高方塊。<br>
            撞到障礙物時身體會被削掉並安全滑過，穿過後平順掉落！
        </p>
        <div style="margin-bottom: 8px; color: #cbd5e1; font-size: 0.9rem;">請選擇遊戲難度：</div>
        <div class="btn-group">
            <button class="btn" onclick="selectDifficulty('easy')">簡單</button>
            <button class="btn active" onclick="selectDifficulty('normal')">普通</button>
            <button class="btn" onclick="selectDifficulty('hard')">困難</button>
        </div>
        <button class="start-btn" onclick="startGame()">開始遊戲</button>
    </div>

    <!-- 結算選單 -->
    <div id="gameOverOverlay" class="overlay hidden">
        <h1 style="background: linear-gradient(135deg, #ff416c, #ff4b2b); -webkit-background-clip: text;">挑戰結束</h1>
        <p class="subtitle" id="gameOverStats">存活時間：00:00.0 | 通過障礙：0</p>
        <button class="start-btn" onclick="startGame()">再玩一次</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const timeDisplay = document.getElementById('timeDisplay');
const scoreDisplay = document.getElementById('scoreDisplay');
const startOverlay = document.getElementById('startOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const gameOverStats = document.getElementById('gameOverStats');

const LAYERS = 10;
let layerHeight = 0;
let blockWidth = 0;

let currentDifficulty = 'normal';
const DIFFICULTY_CONFIG = {
    easy: { baseSpeed: 230, maxBlocks: 6, interval: 2.3, growRate: 20 },
    normal: { baseSpeed: 280, maxBlocks: 7, interval: 1.9, growRate: 15 },
    hard: { baseSpeed: 350, maxBlocks: 8, interval: 1.6, growRate: 10 }
};

let gameState = 'MENU';
let startTime = 0;
let elapsedTime = 0;
let score = 0;

// 玩家屬性
const player = {
    x: 0,
    currentVisualBottom: 9, // 當前底部位於的層（支援小數插值平滑移動）
    targetBottom: 9,        // 目標底部層
    cubeCount: 1,           // 方塊總數 (1~10)
    dropSpeed: 5.5,         // 下墜速度 (大幅放慢，約每秒掉 5.5 層，手感平順)
    hangTimer: 0            // 滯空保護倒數 (秒)
};

let obstacles = [];
let particles = [];
let nextObstacleTime = 0;
let lastFrameTime = 0;

function resizeCanvas() {
    const container = document.getElementById('game-container');
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
    layerHeight = canvas.height / LAYERS;
    blockWidth = layerHeight * 1.05;
    player.x = canvas.width * 0.18;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function selectDifficulty(diff) {
    currentDifficulty = diff;
    document.querySelectorAll('.btn-group .btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(
            diff === 'easy' ? '簡單' : diff === 'normal' ? '普通' : '困難'
        ));
    });
}

function startGame() {
    startOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    
    player.cubeCount = 1;
    player.targetBottom = 9;
    player.currentVisualBottom = 9;
    player.hangTimer = 0;
    
    obstacles = [];
    particles = [];
    score = 0;
    elapsedTime = 0;
    startTime = performance.now();
    lastFrameTime = performance.now();
    nextObstacleTime = 1.2;
    gameState = 'PLAYING';
}

// 增加身體方塊操作（在底部墊高）
function addPlayerCube() {
    if (gameState !== 'PLAYING') return;
    if (player.cubeCount < LAYERS) {
        player.cubeCount++;
        // 任何時候手動墊高，若正處於空中，維持當前懸空高度繼續墊高
        createAddEffect(player.x, (player.currentVisualBottom - player.cubeCount + 1) * layerHeight);
    }
}

// 鍵盤與觸控
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        if (gameState === 'PLAYING') {
            addPlayerCube();
        } else if (gameState === 'GAMEOVER') {
            startGame();
        }
    }
});

canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (gameState === 'PLAYING') {
        addPlayerCube();
    }
});

// 繪製立體等角方塊
function drawIsometricCube(x, y, w, h, mainColor, topColor, sideColor, isHead = false) {
    const depth = h * 0.28;

    // 右側陰影面
    ctx.fillStyle = sideColor;
    ctx.beginPath();
    ctx.moveTo(x + w, y);
    ctx.lineTo(x + w + depth, y - depth);
    ctx.lineTo(x + w + depth, y + h - depth);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 頂部高光面
    ctx.fillStyle = topColor;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + depth, y - depth);
    ctx.lineTo(x + w + depth, y - depth);
    ctx.lineTo(x + w, y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 正面
    ctx.fillStyle = mainColor;
    ctx.fillRect(x, y, w, h);
    ctx.strokeRect(x, y, w, h);

    // 核心眼睛
    if (isHead) {
        ctx.fillStyle = '#ffffff';
        const eyeSize = w * 0.18;
        ctx.fillRect(x + w * 0.65, y + h * 0.35, eyeSize, eyeSize);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(x + w * 0.72, y + h * 0.38, eyeSize * 0.55, eyeSize * 0.55);
    }
}

function createExplosion(x, y, color) {
    for (let i = 0; i < 15; i++) {
        particles.push({
            x: x + blockWidth / 2,
            y: y + layerHeight / 2,
            vx: (Math.random() - 0.5) * 320,
            vy: (Math.random() - 0.5) * 320,
            size: Math.random() * 6 + 4,
            color: color,
            alpha: 1,
            life: 0.5
        });
    }
}

function createAddEffect(x, y) {
    for (let i = 0; i < 4; i++) {
        particles.push({
            x: x + Math.random() * blockWidth,
            y: y + layerHeight,
            vx: (Math.random() - 0.5) * 50,
            vy: -Math.random() * 100 - 30,
            size: 3,
            color: '#38bdf8',
            alpha: 0.9,
            life: 0.35
        });
    }
}

function spawnObstacle() {
    const config = DIFFICULTY_CONFIG[currentDifficulty];
    const timeGrown = Math.floor(elapsedTime / config.growRate);
    const targetBlocks = Math.min(config.maxBlocks, Math.max(2, 2 + timeGrown));

    const layers = Array.from({ length: LAYERS }, (_, i) => i);
    const safeLayer = Math.floor(Math.random() * LAYERS);
    const dangerCandidates = layers.filter(l => l !== safeLayer);
    dangerCandidates.sort(() => Math.random() - 0.5);

    const obstacleLayers = dangerCandidates.slice(0, targetBlocks);

    obstacles.push({
        x: canvas.width + 50,
        layers: obstacleLayers,
        cleared: false,
        hitProcessed: false
    });
}

function update(dt) {
    if (gameState !== 'PLAYING') return;

    elapsedTime += dt;
    const config = DIFFICULTY_CONFIG[currentDifficulty];
    const currentSpeed = config.baseSpeed + elapsedTime * 2.2;

    // 更新時間與過關數
    const mins = Math.floor(elapsedTime / 60);
    const secs = (elapsedTime % 60).toFixed(1);
    timeDisplay.textContent = `${String(mins).padStart(2, '0')}:${secs.padStart(4, '0')}`;
    scoreDisplay.textContent = score;

    nextObstacleTime -= dt;
    if (nextObstacleTime <= 0) {
        spawnObstacle();
        nextObstacleTime = config.interval * (0.85 + Math.random() * 0.35);
    }

    // 檢查是否有正在橫向重疊穿越中的障礙物
    let obstacleUnderPlayer = null;
    const hitPadding = 4; // 碰撞容錯邊距

    for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        if (player.x + blockWidth - hitPadding > obs.x && player.x + hitPadding < obs.x + blockWidth) {
            obstacleUnderPlayer = obs;
            break;
        }
    }

    // 當前頭部核心所在的層數 (以視覺位置為準)
    const currentCoreLayer = Math.round(player.currentVisualBottom) - player.cubeCount + 1;

    // 處理與當前障礙物的碰撞與支撐
    if (obstacleUnderPlayer) {
        const obs = obstacleUnderPlayer;

        // 1. 如果頭部撞到 -> 死亡
        if (obs.layers.includes(currentCoreLayer)) {
            createExplosion(player.x, currentCoreLayer * layerHeight, '#00f2fe');
            gameOver();
            return;
        }

        // 2. 如果身體撞到 -> 削掉身體方塊，並由障礙物頂端支撐，絕不在穿越時下掉！
        if (!obs.hitProcessed) {
            let hitCount = 0;
            for (let b = 1; b < player.cubeCount; b++) {
                const bodyLayer = currentCoreLayer + b;
                if (obs.layers.includes(bodyLayer)) {
                    createExplosion(player.x, bodyLayer * layerHeight, '#f43f5e');
                    hitCount++;
                }
            }

            if (hitCount > 0) {
                // 削掉撞毀的方塊
                player.cubeCount = Math.max(1, player.cubeCount - hitCount);
                obs.hitProcessed = true;
                // 重置滯空緩衝時間 (0.2 秒)，讓玩家穿過後有充足反應期
                player.hangTimer = 0.22;
            }
        }

        // 穿越障礙物期間：被撞掉後的高度由障礙物頂部穩穩托住，不往下掉
        player.targetBottom = player.currentVisualBottom;
    } else {
        // 沒有在障礙物上方時，底端目標恢復為地底第 9 層
        player.targetBottom = 9;

        // 若有滯空緩衝保護，先消耗滯空時間
        if (player.hangTimer > 0) {
            player.hangTimer -= dt;
        } else {
            // 平滑下墜：速度舒適、不暴衝
            if (player.currentVisualBottom < player.targetBottom) {
                player.currentVisualBottom += player.dropSpeed * dt;
                if (player.currentVisualBottom > player.targetBottom) {
                    player.currentVisualBottom = player.targetBottom;
                }
            }
        }
    }

    // 障礙物位移與計分
    for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= currentSpeed * dt;

        if (!obs.cleared && obs.x + blockWidth < player.x) {
            obs.cleared = true;
            score++;
        }

        if (obs.x < -blockWidth * 2) {
            obstacles.splice(i, 1);
        }
    }

    // 粒子更新
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.alpha -= dt / p.life;
        if (p.alpha <= 0) {
            particles.splice(i, 1);
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#0f172a';

    // 1. 繪製 10 層跑道背景
    for (let i = 0; i < LAYERS; i++) {
        const y = i * layerHeight;
        ctx.fillStyle = (i % 2 === 0) ? '#131c31' : '#0f172a';
        ctx.fillRect(0, y, canvas.width, layerHeight);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.font = '10px monospace';
        ctx.fillText(`L${10 - i}`, 8, y + layerHeight * 0.6);
    }

    // 2. 繪製障礙物
    obstacles.forEach(obs => {
        obs.layers.forEach(l => {
            const y = l * layerHeight;
            drawIsometricCube(
                obs.x, y, blockWidth, layerHeight,
                '#ef4444',
                '#f87171',
                '#991b1b',
                false
            );
        });
    });

    // 3. 繪製玩家方塊 (自底向上繪製)
    const visualBottomY = player.currentVisualBottom * layerHeight;
    for (let i = 0; i < player.cubeCount; i++) {
        const y = visualBottomY - (i * layerHeight);
        const isCore = (i === player.cubeCount - 1);

        if (isCore) {
            drawIsometricCube(
                player.x, y, blockWidth, layerHeight,
                '#0284c7',
                '#38bdf8',
                '#0369a1',
                true
            );
        } else {
            drawIsometricCube(
                player.x, y, blockWidth, layerHeight,
                '#4f46e5',
                '#818cf8',
                '#3730a3',
                false
            );
        }
    }

    // 4. 繪製粒子
    particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.restore();
    });
}

function gameOver() {
    gameState = 'GAMEOVER';
    const mins = Math.floor(elapsedTime / 60);
    const secs = (elapsedTime % 60).toFixed(1);
    const timeStr = `${String(mins).padStart(2, '0')}:${secs.padStart(4, '0')}`;
    gameOverStats.innerHTML = `存活時間：<b>${timeStr}</b> &nbsp;|&nbsp; 通過障礙：<b>${score}</b>`;
    gameOverOverlay.classList.remove('hidden');
}

function gameLoop(timestamp) {
    if (!lastFrameTime) lastFrameTime = timestamp;
    const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.1);
    lastFrameTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
