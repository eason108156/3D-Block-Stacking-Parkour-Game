<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>立體方塊跑酷 - 2D精準版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: manipulation;
        }
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 900px;
            height: 100vh;
            max-height: 600px;
            background: #0f172a;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #1e293b;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(11, 15, 25, 0.88);
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        .overlay.hidden {
            display: none;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
            text-align: center;
        }
        p.subtitle {
            color: #94a3b8;
            margin-bottom: 24px;
            font-size: 0.95rem;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 2px solid #334155;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }
        .btn.active {
            background: #0284c7;
            border-color: #38bdf8;
            color: #ffffff;
        }
        .start-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none;
            padding: 14px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.5);
            transition: 0.2s;
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(37, 99, 235, 0.7);
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            z-index: 5;
            pointer-events: none;
            font-family: monospace;
        }
        .hud-item {
            font-size: 1.15rem;
            font-weight: bold;
            color: #f8fafc;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 4px;
        }
        .hud-item span {
            color: #38bdf8;
        }
        #mobile-tip {
            position: absolute;
            bottom: 12px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: #64748b;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div class="hud-item">時間：<span id="timeDisplay">00:00.0</span></div>
        <div class="hud-item">過關數：<span id="scoreDisplay">0</span></div>
    </div>
    <div id="mobile-tip">空白鍵 (Space) 或 點擊螢幕增加方塊墊高</div>

    <div id="startOverlay" class="overlay">
        <h1>2D 精準分層跑酷</h1>
        <p class="subtitle">
            畫面精確分為 10 等層！按<b>空白鍵</b>或<b>點擊螢幕</b>向上墊高。<br>
            撞擊障礙時底層方塊被削掉，核心安全滑過後平順掉落！
        </p>
        <div style="margin-bottom: 8px; color: #cbd5e1; font-size: 0.9rem;">請選擇遊戲難度：</div>
        <div class="btn-group">
            <button class="btn" onclick="selectDifficulty('easy')">簡單</button>
            <button class="btn active" onclick="selectDifficulty('normal')">普通</button>
            <button class="btn" onclick="selectDifficulty('hard')">困難</button>
        </div>
        <button class="start-btn" onclick="startGame()">開始遊戲</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
        <h1 style="background: linear-gradient(135deg, #ff416c, #ff4b2b); -webkit-background-clip: text;">挑戰結束</h1>
        <p class="subtitle" id="gameOverStats">存活時間：00:00.0 | 通過障礙：0</p>
        <button class="start-btn" onclick="startGame()">再玩一次</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const timeDisplay = document.getElementById('timeDisplay');
const scoreDisplay = document.getElementById('scoreDisplay');
const startOverlay = document.getElementById('startOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const gameOverStats = document.getElementById('gameOverStats');

const LAYERS = 10;
let layerHeight = 0;
let blockSize = 0; // 2D 正方形大小

let currentDifficulty = 'normal';
const DIFFICULTY_CONFIG = {
    easy: { baseSpeed: 230, maxBlocks: 6, interval: 2.3, growRate: 20 },
    normal: { baseSpeed: 280, maxBlocks: 7, interval: 1.9, growRate: 15 },
    hard: { baseSpeed: 350, maxBlocks: 8, interval: 1.6, growRate: 10 }
};

let gameState = 'MENU';
let elapsedTime = 0;
let score = 0;
let obstacleIdCounter = 0;

const player = {
    x: 0,
    currentVisualBottom: 9, // 當前底部的連續位置 (浮點數，支援平滑墜落)
    cubeCount: 1,           // 方塊數量 (1~10)
    dropSpeed: 6.0,         // 平順下墜速度 (層/秒)
    hangTimer: 0            // 滯空保護時間
};

let obstacles = [];
let particles = [];
let nextObstacleTime = 0;
let lastFrameTime = 0;

function resizeCanvas() {
    const container = document.getElementById('game-container');
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
    layerHeight = canvas.height / LAYERS;
    blockSize = layerHeight; // 純 2D 精準正方形
    player.x = canvas.width * 0.18;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function selectDifficulty(diff) {
    currentDifficulty = diff;
    document.querySelectorAll('.btn-group .btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(
            diff === 'easy' ? '簡單' : diff === 'normal' ? '普通' : '困難'
        ));
    });
}

function startGame() {
    startOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    
    player.cubeCount = 1;
    player.currentVisualBottom = 9;
    player.hangTimer = 0;
    
    obstacles = [];
    particles = [];
    score = 0;
    elapsedTime = 0;
    obstacleIdCounter = 0;
    lastFrameTime = performance.now();
    nextObstacleTime = 1.2;
    gameState = 'PLAYING';
}

function addPlayerCube() {
    if (gameState !== 'PLAYING') return;
    
    // 當前頭部所在層
    const currentCoreLayer = player.currentVisualBottom - player.cubeCount + 1;
    if (currentCoreLayer <= 0.05 || player.cubeCount >= LAYERS) {
        return;
    }

    player.cubeCount++;
    createAddEffect(player.x, (currentCoreLayer - 1) * layerHeight);
}

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        if (gameState === 'PLAYING') {
            addPlayerCube();
        } else if (gameState === 'GAMEOVER') {
            startGame();
        }
    }
});

canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (gameState === 'PLAYING') {
        addPlayerCube();
    }
});

// 繪製 2D 精準方塊
function draw2DBlock(x, y, size, type) {
    const pad = 1.5; // 邊界微縫隙，方便一眼看清方塊數量
    const bx = x + pad;
    const by = y + pad;
    const bs = size - pad * 2;

    if (type === 'core') {
        // 核心頭部：青藍色科技感
        ctx.fillStyle = '#0ea5e9';
        ctx.fillRect(bx, by, bs, bs);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(bx, by, bs, bs);

        // 眼睛
        ctx.fillStyle = '#ffffff';
        const eyeSize = bs * 0.22;
        ctx.fillRect(bx + bs * 0.6, by + bs * 0.28, eyeSize, eyeSize);
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(bx + bs * 0.68, by + bs * 0.32, eyeSize * 0.55, eyeSize * 0.55);

    } else if (type === 'body') {
        // 身體方塊：深藍紫方格
        ctx.fillStyle = '#4f46e5';
        ctx.fillRect(bx, by, bs, bs);
        ctx.strokeStyle = '#818cf8';
        ctx.lineWidth = 2;
        ctx.strokeRect(bx, by, bs, bs);

        // 內部裝飾方芯
        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.fillRect(bx + bs * 0.25, by + bs * 0.25, bs * 0.5, bs * 0.5);

    } else if (type === 'obstacle') {
        // 障礙方塊：鮮紅警告方塊
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(bx, by, bs, bs);
        ctx.strokeStyle = '#f87171';
        ctx.lineWidth = 2;
        ctx.strokeRect(bx, by, bs, bs);

        // 標記紅色「✕」符號
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        const m = bs * 0.28;
        ctx.moveTo(bx + m, by + m);
        ctx.lineTo(bx + bs - m, by + bs - m);
        ctx.moveTo(bx + bs - m, by + m);
        ctx.lineTo(bx + m, by + bs - m);
        ctx.stroke();
    }
}

function createExplosion(x, y, color) {
    for (let i = 0; i < 14; i++) {
        particles.push({
            x: x + blockSize / 2,
            y: y + layerHeight / 2,
            vx: (Math.random() - 0.5) * 320,
            vy: (Math.random() - 0.5) * 320,
            size: Math.random() * 5 + 3,
            color: color,
            alpha: 1,
            life: 0.45
        });
    }
}

function createAddEffect(x, y) {
    for (let i = 0; i < 4; i++) {
        particles.push({
            x: x + Math.random() * blockSize,
            y: y + layerHeight,
            vx: (Math.random() - 0.5) * 40,
            vy: -Math.random() * 80 - 20,
            size: 3,
            color: '#38bdf8',
            alpha: 0.9,
            life: 0.3
        });
    }
}

function spawnObstacle() {
    const config = DIFFICULTY_CONFIG[currentDifficulty];
    const timeGrown = Math.floor(elapsedTime / config.growRate);
    const targetBlocks = Math.min(config.maxBlocks, Math.max(2, 2 + timeGrown));

    const layers = Array.from({ length: LAYERS }, (_, i) => i);
    const safeLayer = Math.floor(Math.random() * LAYERS);
    const dangerCandidates = layers.filter(l => l !== safeLayer);
    dangerCandidates.sort(() => Math.random() - 0.5);

    const obstacleLayers = dangerCandidates.slice(0, targetBlocks);

    obstacles.push({
        id: ++obstacleIdCounter,
        x: canvas.width + 20,
        layers: new Set(obstacleLayers),
        cleared: false,
        resolved: false
    });
}

function update(dt) {
    if (gameState !== 'PLAYING') return;

    elapsedTime += dt;
    const config = DIFFICULTY_CONFIG[currentDifficulty];
    const currentSpeed = config.baseSpeed + elapsedTime * 2.2;

    const mins = Math.floor(elapsedTime / 60);
    const secs = (elapsedTime % 60).toFixed(1);
    timeDisplay.textContent = `${String(mins).padStart(2, '0')}:${secs.padStart(4, '0')}`;
    scoreDisplay.textContent = score;

    nextObstacleTime -= dt;
    if (nextObstacleTime <= 0) {
        spawnObstacle();
        nextObstacleTime = config.interval * (0.85 + Math.random() * 0.35);
    }

    const hitPadding = 3;
    let isCurrentlyOverlappingAnyObstacle = false;
    const currentCoreLayer = Math.round(player.currentVisualBottom - player.cubeCount + 1);

    for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        const isXOverlap = (player.x + blockSize - hitPadding > obs.x && player.x + hitPadding < obs.x + blockSize);

        if (isXOverlap) {
            isCurrentlyOverlappingAnyObstacle = true;

            // 唯一一次精確結算
            if (!obs.resolved) {
                // 1. 核心碰撞 -> 死亡
                if (obs.layers.has(currentCoreLayer)) {
                    createExplosion(player.x, currentCoreLayer * layerHeight, '#00f2fe');
                    gameOver();
                    return;
                }

                // 2. 身體碰撞判定
                let highestHitObstacle = LAYERS;
                for (let b = 1; b < player.cubeCount; b++) {
                    const checkLayer = currentCoreLayer + b;
                    if (obs.layers.has(checkLayer)) {
                        createExplosion(player.x, checkLayer * layerHeight, '#f43f5e');
                        highestHitObstacle = Math.min(highestHitObstacle, checkLayer);
                    }
                }

                // 削塊與位置重新錨定 (核心高度完全不動)
                if (highestHitObstacle < LAYERS) {
                    const remainingCubes = highestHitObstacle - currentCoreLayer;
                    player.cubeCount = Math.max(1, remainingCubes);
                    player.currentVisualBottom = currentCoreLayer + player.cubeCount - 1;
                    player.hangTimer = 0.25;
                }

                obs.resolved = true;
            }
        }

        if (!obs.cleared && obs.x + blockSize < player.x) {
            obs.cleared = true;
            score++;
        }

        if (obs.x < -blockSize * 2) {
            obstacles.splice(i, 1);
            i--;
        }

        obs.x -= currentSpeed * dt;
    }

    // 離開障礙物後平穩向下墜落
    if (!isCurrentlyOverlappingAnyObstacle) {
        if (player.hangTimer > 0) {
            player.hangTimer -= dt;
        } else {
            const targetFloor = 9;
            if (player.currentVisualBottom < targetFloor) {
                player.currentVisualBottom += player.dropSpeed * dt;
                if (player.currentVisualBottom > targetFloor) {
                    player.currentVisualBottom = targetFloor;
                }
            }
        }
    }

    // 粒子更新
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.alpha -= dt / p.life;
        if (p.alpha <= 0) {
            particles.splice(i, 1);
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 繪製 10 等層背景跑道
    for (let i = 0; i < LAYERS; i++) {
        const y = i * layerHeight;
        ctx.fillStyle = (i % 2 === 0) ? '#111c33' : '#0c1324';
        ctx.fillRect(0, y, canvas.width, layerHeight);

        // 分割線
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();

        // 層數標記 (L1 ~ L10)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
        ctx.font = 'bold 11px monospace';
        ctx.fillText(`L${10 - i}`, 8, y + layerHeight * 0.6);
    }

    // 2. 繪製 2D 障礙物方塊
    obstacles.forEach(obs => {
        obs.layers.forEach(l => {
            const y = l * layerHeight;
            draw2DBlock(obs.x, y, blockSize, 'obstacle');
        });
    });

    // 3. 繪製 2D 玩家方塊 (自底向上繪製)
    const visualBottomY = player.currentVisualBottom * layerHeight;
    for (let i = 0; i < player.cubeCount; i++) {
        const y = visualBottomY - (i * layerHeight);
        const isCore = (i === player.cubeCount - 1);
        draw2DBlock(player.x, y, blockSize, isCore ? 'core' : 'body');
    }

    // 4. 繪製粒子
    particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.restore();
    });
}

function gameOver() {
    gameState = 'GAMEOVER';
    const mins = Math.floor(elapsedTime / 60);
    const secs = (elapsedTime % 60).toFixed(1);
    const timeStr = `${String(mins).padStart(2, '0')}:${secs.padStart(4, '0')}`;
    gameOverStats.innerHTML = `存活時間：<b>${timeStr}</b> &nbsp;|&nbsp; 通過障礙：<b>${score}</b>`;
    gameOverOverlay.classList.remove('hidden');
}

function gameLoop(timestamp) {
    if (!lastFrameTime) lastFrameTime = timestamp;
    const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.1);
    lastFrameTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
