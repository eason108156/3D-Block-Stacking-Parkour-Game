<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>立體方塊跑酷 - 獵龍槍武裝版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: manipulation;
        }
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 900px;
            height: 100vh;
            max-height: 600px;
            background: #0f172a;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #1e293b;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(11, 15, 25, 0.88);
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        .overlay.hidden {
            display: none;
        }
        h1 {
            font-size: 2.3rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
            text-align: center;
        }
        p.subtitle {
            color: #94a3b8;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: center;
            max-width: 85%;
            line-height: 1.5;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 2px solid #334155;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }
        .btn.active {
            background: #0284c7;
            border-color: #38bdf8;
            color: #ffffff;
        }
        .start-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none;
            padding: 14px 40px;
            font-size: 1.15rem;
            font-weight: bold;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.5);
            transition: 0.2s;
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(37, 99, 235, 0.7);
        }

        /* 左上角 HUD */
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            z-index: 5;
            pointer-events: none;
            font-family: monospace;
        }
        .hud-item {
            font-size: 1.15rem;
            font-weight: bold;
            color: #f8fafc;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 4px;
        }
        .hud-item span {
            color: #38bdf8;
        }

        /* 右上角暫停按鈕 */
        #pauseBtn {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 12;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #334155;
            color: #f8fafc;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #pauseBtn:hover {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
            transform: scale(1.03);
        }
        #pauseBtn.paused {
            background: #0284c7;
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.7);
        }
        #pauseBtn.hidden {
            display: none;
        }

        /* 道具欄 (右下角操作按鈕，含右側模式切換) */
        #item-bar {
            position: absolute;
            bottom: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
            z-index: 5;
            max-width: 90%;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .item-btn {
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #334155;
            color: #94a3b8;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            overflow: hidden;
        }
        .item-main-action {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .item-main-action:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .item-btn.has-item {
            border-color: #f59e0b;
            color: #f8fafc;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.35);
        }
        .item-btn.nuke.has-item {
            border-color: #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.35);
        }
        .item-btn.gun.has-item {
            border-color: #10b981;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.35);
        }
        .item-btn.aiming {
            border-color: #38bdf8;
            background: #0369a1;
            color: #ffffff;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.8);
            animation: pulse 0.8s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.04); }
        }
        .item-count {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 0.8rem;
        }

        .mode-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 7px;
            font-size: 0.75rem;
            font-weight: bold;
            border-left: 1px solid #334155;
            background: rgba(30, 41, 59, 0.7);
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 44px;
        }
        .mode-toggle:hover {
            background: rgba(51, 65, 85, 0.9);
            color: #ffffff;
        }
        .mode-toggle.auto {
            background: #0284c7;
            color: #ffffff;
            box-shadow: inset 0 0 8px rgba(56, 189, 248, 0.6);
        }
        .item-btn.nuke .mode-toggle.auto {
            background: #dc2626;
            box-shadow: inset 0 0 8px rgba(248, 113, 113, 0.6);
        }
        .item-btn.gun .mode-toggle.auto {
            background: #059669;
            box-shadow: inset 0 0 8px rgba(52, 211, 153, 0.6);
        }

        #aim-banner {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(2, 132, 199, 0.9);
            color: white;
            padding: 8px 24px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            box-shadow: 0 0 20px rgba(2, 132, 199, 0.6);
            display: none;
            z-index: 6;
            pointer-events: none;
        }
        #mobile-tip {
            position: absolute;
            bottom: 12px;
            left: 20px;
            font-size: 0.75rem;
            color: #64748b;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div class="hud-item">時間：<span id="timeDisplay">00:00.0</span></div>
        <div class="hud-item">過關數：<span id="scoreDisplay">0</span></div>
    </div>

    <button id="pauseBtn" class="hidden" onclick="togglePause(event)">
        <span id="pauseBtnText">⏸️ 暫停</span>
    </button>

    <div id="aim-banner">💣 點擊任意紅色障礙物將其引爆！</div>

    <!-- 道具欄區 (C4 / 核彈 / 槍) -->
    <div id="item-bar">
        <!-- 1. C4 -->
        <div class="item-btn" id="btnC4">
            <div class="item-main-action" onclick="handleC4Click(event)">
                <span>💣 C4 [1]</span>
                <span class="item-count" id="c4Count">0</span>
            </div>
            <div class="mode-toggle" id="c4ModeBtn" onclick="toggleC4Mode(event)" title="點擊切換 手動/自動">
                手動
            </div>
        </div>

        <!-- 2. 核彈 -->
        <div class="item-btn nuke" id="btnNuke">
            <div class="item-main-action" onclick="handleNukeClick(event)">
                <span>☢️ 核彈 [2]</span>
                <span class="item-count" id="nukeCount">0</span>
            </div>
            <div class="mode-toggle" id="nukeModeBtn" onclick="toggleNukeMode(event)" title="點擊切換 手動/自動">
                手動
            </div>
        </div>

        <!-- 3. 槍 (新增) -->
        <div class="item-btn gun" id="btnGun">
            <div class="item-main-action" onclick="handleGunClick(event)">
                <span>🔫 槍 [3]</span>
                <span class="item-count" id="gunCount">0</span>
            </div>
            <div class="mode-toggle" id="gunModeBtn" onclick="toggleGunMode(event)" title="點擊切換 手動/自動">
                手動
            </div>
        </div>
    </div>

    <div id="mobile-tip">空白鍵 (Space) 或 點擊墊高 | P 鍵暫停</div>

    <!-- 起始畫面 -->
    <div id="startOverlay" class="overlay">
        <h1>2D 精準分層跑酷</h1>
        <p class="subtitle">
            撞擊<b>金色問號方塊「？」</b>依機率抽取裝備：<br>
            <b>[C4: 20]</b> 炸毀指定障礙 | <b>[核彈: 10]</b> 炸平整列障礙<br>
            <b>[槍: 3]</b> 專門狙殺免疫爆炸的翼龍！<br>
            各道具右側均支援<b>【自動觸發模式】</b>！
        </p>
        <div style="margin-bottom: 8px; color: #cbd5e1; font-size: 0.9rem;">請選擇遊戲難度：</div>
        <div class="btn-group">
            <button class="btn" onclick="selectDifficulty('easy')">簡單</button>
            <button class="btn active" onclick="selectDifficulty('normal')">普通</button>
            <button class="btn" onclick="selectDifficulty('hard')">困難</button>
        </div>
        <button class="start-btn" onclick="startGame()">開始遊戲</button>
    </div>

    <!-- 結算畫面 -->
    <div id="gameOverOverlay" class="overlay hidden">
        <h1 style="background: linear-gradient(135deg, #ff416c, #ff4b2b); -webkit-background-clip: text;">挑戰結束</h1>
        <p class="subtitle" id="gameOverStats">存活時間：00:00.0 | 通過障礙：0</p>
        <button class="start-btn" onclick="startGame()">再玩一次</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const timeDisplay = document.getElementById('timeDisplay');
const scoreDisplay = document.getElementById('scoreDisplay');
const startOverlay = document.getElementById('startOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const gameOverStats = document.getElementById('gameOverStats');

// 道具 UI DOM
const c4CountDisplay = document.getElementById('c4Count');
const nukeCountDisplay = document.getElementById('nukeCount');
const gunCountDisplay = document.getElementById('gunCount');
const btnC4 = document.getElementById('btnC4');
const btnNuke = document.getElementById('btnNuke');
const btnGun = document.getElementById('btnGun');
const c4ModeBtn = document.getElementById('c4ModeBtn');
const nukeModeBtn = document.getElementById('nukeModeBtn');
const gunModeBtn = document.getElementById('gunModeBtn');

const aimBanner = document.getElementById('aim-banner');
const pauseBtn = document.getElementById('pauseBtn');
const pauseBtnText = document.getElementById('pauseBtnText');

const LAYERS = 10;
let layerHeight = 0;
let blockSize = 0;

let currentDifficulty = 'normal';
const DIFFICULTY_CONFIG = {
    easy: { baseSpeed: 230, maxBlocks: 6, interval: 2.3, growRate: 20 },
    normal: { baseSpeed: 280, maxBlocks: 7, interval: 1.9, growRate: 15 },
    hard: { baseSpeed: 350, maxBlocks: 8, interval: 1.6, growRate: 10 }
};

let gameState = 'MENU';
let isPaused = false;
let elapsedTime = 0;
let score = 0;
let obstacleIdCounter = 0;

// 道具數量與模式
let c4Amount = 0;
let nukeAmount = 0;
let gunAmount = 0;
let c4Mode = 'manual';
let nukeMode = 'manual';
let gunMode = 'manual';
let isAimingC4 = false;

// 機率權重設定：[C4: 20], [核彈: 10], [槍: 3]
const ITEM_WEIGHTS = {
    C4: 20,
    NUKE: 10,
    GUN: 3
};
const TOTAL_WEIGHT = ITEM_WEIGHTS.C4 + ITEM_WEIGHTS.NUKE + ITEM_WEIGHTS.GUN; // 33

function rollRandomItem() {
    const rand = Math.random() * TOTAL_WEIGHT;
    if (rand < ITEM_WEIGHTS.C4) {
        return 'C4';
    } else if (rand < ITEM_WEIGHTS.C4 + ITEM_WEIGHTS.NUKE) {
        return 'NUKE';
    } else {
        return 'GUN';
    }
}

const player = {
    x: 0,
    currentVisualBottom: 9,
    cubeCount: 1,
    dropSpeed: 6.0,
    hangTimer: 0
};

let obstacles = [];
let bonusCubes = [];
let pterodactyls = [];
let bullets = []; // 開槍射擊彈道線
let particles = [];
let nextObstacleTime = 0;
let nextBonusTime = 0;
let nextPteroTime = 0;
let lastFrameTime = 0;
let flashAlpha = 0;

function resizeCanvas() {
    const container = document.getElementById('game-container');
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
    layerHeight = canvas.height / LAYERS;
    blockSize = layerHeight;
    player.x = canvas.width * 0.18;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function selectDifficulty(diff) {
    currentDifficulty = diff;
    document.querySelectorAll('.btn-group .btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(
            diff === 'easy' ? '簡單' : diff === 'normal' ? '普通' : '困難'
        ));
    });
}

function updateItemsUI() {
    c4CountDisplay.textContent = c4Amount;
    nukeCountDisplay.textContent = nukeAmount;
    gunCountDisplay.textContent = gunAmount;

    btnC4.classList.toggle('has-item', c4Amount > 0);
    btnNuke.classList.toggle('has-item', nukeAmount > 0);
    btnGun.classList.toggle('has-item', gunAmount > 0);

    btnC4.classList.toggle('aiming', isAimingC4);
    aimBanner.style.display = isAimingC4 ? 'block' : 'none';

    c4ModeBtn.textContent = (c4Mode === 'auto') ? '自動' : '手動';
    c4ModeBtn.classList.toggle('auto', c4Mode === 'auto');

    nukeModeBtn.textContent = (nukeMode === 'auto') ? '自動' : '手動';
    nukeModeBtn.classList.toggle('auto', nukeMode === 'auto');

    gunModeBtn.textContent = (gunMode === 'auto') ? '自動' : '手動';
    gunModeBtn.classList.toggle('auto', gunMode === 'auto');
}

// 模式切換
function toggleC4Mode(e) {
    if (e) e.stopPropagation();
    c4Mode = (c4Mode === 'manual') ? 'auto' : 'manual';
    if (c4Mode === 'auto' && isAimingC4) isAimingC4 = false;
    updateItemsUI();
}

function toggleNukeMode(e) {
    if (e) e.stopPropagation();
    nukeMode = (nukeMode === 'manual') ? 'auto' : 'manual';
    updateItemsUI();
}

function toggleGunMode(e) {
    if (e) e.stopPropagation();
    gunMode = (gunMode === 'manual') ? 'auto' : 'manual';
    updateItemsUI();
}

// 點擊 C4
function handleC4Click(e) {
    if (e) e.stopPropagation();
    if (gameState !== 'PLAYING' || isPaused || c4Amount <= 0) return;
    if (c4Mode === 'auto') {
        triggerC4Auto();
    } else {
        isAimingC4 = !isAimingC4;
        updateItemsUI();
    }
}

// 點擊核彈
function handleNukeClick(e) {
    if (e) e.stopPropagation();
    if (gameState !== 'PLAYING' || isPaused || nukeAmount <= 0) return;
    executeNukeBlast();
}

// 點擊槍 (狙殺前方翼龍)
function handleGunClick(e) {
    if (e) e.stopPropagation();
    if (gameState !== 'PLAYING' || isPaused || gunAmount <= 0) return;
    executeGunShot();
}

// 執行開槍擊殺翼龍核心邏輯
function executeGunShot() {
    if (gunAmount <= 0) return false;

    // 尋找在玩家前方最近的翼龍
    let targetPtero = null;
    let minDistance = Infinity;
    for (let p of pterodactyls) {
        if (p.x + blockSize > player.x && p.x < minDistance) {
            minDistance = p.x;
            targetPtero = p;
        }
    }

    if (targetPtero) {
        gunAmount--;
        updateItemsUI();

        // 產生開火光束
        const currentCoreY = (player.currentVisualBottom - player.cubeCount + 1 + 0.5) * layerHeight;
        const targetY = (targetPtero.layer + 0.5) * layerHeight;
        bullets.push({
            x1: player.x + blockSize,
            y1: currentCoreY,
            x2: targetPtero.x + blockSize * 0.5,
            y2: targetY,
            alpha: 1.0
        });

        // 翼龍被擊中炸裂
        createExplosion(targetPtero.x, targetPtero.layer * layerHeight, '#10b981', 25);
        createExplosion(targetPtero.x, targetPtero.layer * layerHeight, '#c084fc', 20);
        addFloatingText(targetPtero.x, targetPtero.layer * layerHeight, '🎯 翼龍已擊斃!', '#34d399');

        targetPtero.resolved = true;
        const idx = pterodactyls.indexOf(targetPtero);
        if (idx !== -1) pterodactyls.splice(idx, 1);

        return true;
    } else {
        addFloatingText(player.x, 80, '⚠️ 前方無翼龍!', '#94a3b8');
        return false;
    }
}

// 槍自動狙擊
function triggerGunAuto() {
    if (gunAmount <= 0) return false;
    for (let p of pterodactyls) {
        // 當翼龍進入前方危險射程 (距離玩家 6.5 格內)
        if (p.x > player.x && p.x - player.x < blockSize * 6.5) {
            return executeGunShot();
        }
    }
    return false;
}

// 執行核彈爆炸
function executeNukeBlast() {
    let targetIndex = -1;
    let minDistance = Infinity;
    for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        if (obs.x + blockSize > player.x && obs.x < minDistance) {
            minDistance = obs.x;
            targetIndex = i;
        }
    }

    if (targetIndex !== -1) {
        nukeAmount--;
        updateItemsUI();

        const targetObs = obstacles[targetIndex];
        targetObs.layers.forEach(layer => {
            createExplosion(targetObs.x, layer * layerHeight, '#f59e0b', 24);
        });
        obstacles.splice(targetIndex, 1);
        score++;
        flashAlpha = 0.85;

        // 翼龍免疫核彈
        pterodactyls.forEach(p => {
            if (p.x > 0 && p.x < canvas.width) {
                addFloatingText(p.x, p.layer * layerHeight, '🛡️ 翼龍免疫核彈!', '#c084fc');
            }
        });

        return true;
    }
    return false;
}

// C4 自動鎖定
function triggerC4Auto() {
    if (c4Amount <= 0) return false;

    let closestObs = null;
    let minDistance = Infinity;
    for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        if (obs.x + blockSize > player.x && obs.x < minDistance) {
            minDistance = obs.x;
            closestObs = obs;
        }
    }

    if (!closestObs || closestObs.layers.size === 0) return false;
    if (closestObs.x - player.x > blockSize * 4.5) return false;

    const currentCoreLayer = Math.round(player.currentVisualBottom - player.cubeCount + 1);

    if (closestObs.layers.has(currentCoreLayer)) {
        closestObs.layers.delete(currentCoreLayer);
        c4Amount--;
        createExplosion(closestObs.x, currentCoreLayer * layerHeight, '#38bdf8', 25);
        addFloatingText(closestObs.x, currentCoreLayer * layerHeight, '💣 C4 自動攔截!', '#38bdf8');
        updateItemsUI();
        return true;
    }

    for (let b = 1; b < player.cubeCount; b++) {
        const bodyLayer = currentCoreLayer + b;
        if (closestObs.layers.has(bodyLayer)) {
            closestObs.layers.delete(bodyLayer);
            c4Amount--;
            createExplosion(closestObs.x, bodyLayer * layerHeight, '#38bdf8', 25);
            addFloatingText(closestObs.x, bodyLayer * layerHeight, '💣 C4 自動破壞!', '#38bdf8');
            updateItemsUI();
            return true;
        }
    }

    let chosenLayer = null;
    let minLayerDiff = Infinity;
    for (let l of closestObs.layers) {
        const diff = Math.abs(l - currentCoreLayer);
        if (diff < minLayerDiff) {
            minLayerDiff = diff;
            chosenLayer = l;
        }
    }

    if (chosenLayer !== null) {
        closestObs.layers.delete(chosenLayer);
        c4Amount--;
        createExplosion(closestObs.x, chosenLayer * layerHeight, '#38bdf8', 25);
        addFloatingText(closestObs.x, chosenLayer * layerHeight, '💣 C4 自動破壞!', '#38bdf8');
        updateItemsUI();
        return true;
    }

    return false;
}

function togglePause(e) {
    if (e) e.stopPropagation();
    if (gameState !== 'PLAYING') return;

    isPaused = !isPaused;

    if (isPaused) {
        pauseBtnText.textContent = '▶️ 繼續';
        pauseBtn.classList.add('paused');
        if (isAimingC4) {
            isAimingC4 = false;
            updateItemsUI();
        }
    } else {
        pauseBtnText.textContent = '⏸️ 暫停';
        pauseBtn.classList.remove('paused');
        lastFrameTime = performance.now();
    }
}

function startGame() {
    startOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    
    isPaused = false;
    pauseBtn.classList.remove('hidden', 'paused');
    pauseBtnText.textContent = '⏸️ 暫停';

    player.cubeCount = 1;
    player.currentVisualBottom = 9;
    player.hangTimer = 0;
    
    obstacles = [];
    bonusCubes = [];
    pterodactyls = [];
    bullets = [];
    particles = [];
    score = 0;
    elapsedTime = 0;
    obstacleIdCounter = 0;
    
    c4Amount = 1;
    nukeAmount = 0;
    gunAmount = 0;
    isAimingC4 = false;
    updateItemsUI();

    lastFrameTime = performance.now();
    nextObstacleTime = 1.2;
    nextBonusTime = 3.2;
    nextPteroTime = 4.0;
    gameState = 'PLAYING';
}

function addPlayerCube() {
    if (gameState !== 'PLAYING' || isPaused) return;
    const currentCoreLayer = player.currentVisualBottom - player.cubeCount + 1;
    if (currentCoreLayer <= 0.05 || player.cubeCount >= LAYERS) return;

    player.cubeCount++;
    createAddEffect(player.x, (currentCoreLayer - 1) * layerHeight);
}

// 點擊畫布事件 (支援開槍點殺翼龍 & C4 點擊引爆)
canvas.addEventListener('pointerdown', (e) => {
    if (gameState !== 'PLAYING' || isPaused) return;

    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;
    const clickedLayer = Math.floor(clickY / layerHeight);

    // 1. 檢查是否直接點擊了翼龍
    for (let i = 0; i < pterodactyls.length; i++) {
        const p = pterodactyls[i];
        if (clickX >= p.x && clickX <= p.x + blockSize * 1.2 && p.layer === clickedLayer) {
            if (gunAmount > 0) {
                // 有槍，直接消耗 1 發將其擊殺！
                executeGunShot();
                return;
            } else {
                addFloatingText(p.x, p.layer * layerHeight, '🛡️ 需使用「槍」擊殺!', '#c084fc');
                return;
            }
        }
    }

    // 2. 檢查點擊紅色障礙物
    let hitObstacle = false;
    for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        if (clickX >= obs.x && clickX <= obs.x + blockSize && obs.layers.has(clickedLayer)) {
            if (c4Amount > 0) {
                c4Amount--;
                obs.layers.delete(clickedLayer);
                createExplosion(obs.x, clickedLayer * layerHeight, '#38bdf8', 25);
                hitObstacle = true;
                isAimingC4 = false;
                updateItemsUI();
                break;
            }
        }
    }

    if (!hitObstacle && !isAimingC4) {
        addPlayerCube();
    } else if (isAimingC4 && !hitObstacle) {
        isAimingC4 = false;
        updateItemsUI();
    }
});

// 鍵盤監聽 (支援 1, 2, 3 與 Shift+1, Shift+2, Shift+3)
window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyP' || e.code === 'Escape') {
        e.preventDefault();
        togglePause();
        return;
    }

    if (isPaused) return;

    // 快捷鍵切換模式
    if (e.shiftKey && (e.code === 'Digit1' || e.code === 'KeyC')) {
        toggleC4Mode();
    } else if (e.shiftKey && (e.code === 'Digit2' || e.code === 'KeyN')) {
        toggleNukeMode();
    } else if (e.shiftKey && (e.code === 'Digit3' || e.code === 'KeyG')) {
        toggleGunMode();
    } else if (e.code === 'Space') {
        e.preventDefault();
        if (gameState === 'PLAYING') {
            if (isAimingC4) isAimingC4 = false;
            addPlayerCube();
        } else if (gameState === 'GAMEOVER') {
            startGame();
        }
    } else if (e.code === 'Digit1' || e.code === 'KeyC') {
        handleC4Click();
    } else if (e.code === 'Digit2' || e.code === 'KeyN') {
        handleNukeClick();
    } else if (e.code === 'Digit3' || e.code === 'KeyG') {
        handleGunClick();
    }
});

// 生成問號獎勵方塊
function spawnBonusCube() {
    const layer = Math.floor(Math.random() * LAYERS);
    bonusCubes.push({
        x: canvas.width + 30,
        layer: layer,
        collected: false
    });
}

function spawnPterodactyl() {
    const possibleLayers = [1, 2, 3, 4, 5, 6, 7, 8];
    const layer = possibleLayers[Math.floor(Math.random() * possibleLayers.length)];
    pterodactyls.push({
        x: canvas.width + 40,
        layer: layer,
        speedBonus: 40 + Math.random() * 30,
        wingTimer: 0,
        wingUp: true,
        cleared: false,
        resolved: false
    });
}

function spawnObstacle() {
    const config = DIFFICULTY_CONFIG[currentDifficulty];
    const timeGrown = Math.floor(elapsedTime / config.growRate);
    const targetBlocks = Math.min(config.maxBlocks, Math.max(2, 2 + timeGrown));

    const layers = Array.from({ length: LAYERS }, (_, i) => i);
    const safeLayer = Math.floor(Math.random() * LAYERS);
    const dangerCandidates = layers.filter(l => l !== safeLayer);
    dangerCandidates.sort(() => Math.random() - 0.5);

    const obstacleLayers = dangerCandidates.slice(0, targetBlocks);

    obstacles.push({
        id: ++obstacleIdCounter,
        x: canvas.width + 20,
        layers: new Set(obstacleLayers),
        cleared: false,
        resolved: false
    });
}

function createExplosion(x, y, color, count = 14) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x + blockSize / 2,
            y: y + layerHeight / 2,
            vx: (Math.random() - 0.5) * 360,
            vy: (Math.random() - 0.5) * 360,
            size: Math.random() * 6 + 3,
            color: color,
            alpha: 1,
            life: 0.45
        });
    }
}

function createAddEffect(x, y) {
    for (let i = 0; i < 4; i++) {
        particles.push({
            x: x + Math.random() * blockSize,
            y: y + layerHeight,
            vx: (Math.random() - 0.5) * 40,
            vy: -Math.random() * 80 - 20,
            size: 3,
            color: '#38bdf8',
            alpha: 0.9,
            life: 0.3
        });
    }
}

let floatTexts = [];
function addFloatingText(x, y, text, color) {
    floatTexts.push({ x, y, text, color, alpha: 1, vy: -50 });
}

function update(dt) {
    if (gameState !== 'PLAYING' || isPaused) return;

    const timeScale = isAimingC4 ? 0.25 : 1.0;
    const scaledDt = dt * timeScale;

    elapsedTime += scaledDt;
    const config = DIFFICULTY_CONFIG[currentDifficulty];
    const currentSpeed = config.baseSpeed + elapsedTime * 2.2;

    const mins = Math.floor(elapsedTime / 60);
    const secs = (elapsedTime % 60).toFixed(1);
    timeDisplay.textContent = `${String(mins).padStart(2, '0')}:${secs.padStart(4, '0')}`;
    scoreDisplay.textContent = score;

    nextObstacleTime -= scaledDt;
    if (nextObstacleTime <= 0) {
        spawnObstacle();
        nextObstacleTime = config.interval * (0.85 + Math.random() * 0.35);
    }

    nextBonusTime -= scaledDt;
    if (nextBonusTime <= 0) {
        spawnBonusCube();
        nextBonusTime = 5.5 + Math.random() * 4.0;
    }

    nextPteroTime -= scaledDt;
    if (nextPteroTime <= 0) {
        spawnPterodactyl();
        nextPteroTime = 7.0 + Math.random() * 4.0;
    }

    // 自動模式判定
    if (nukeMode === 'auto' && nukeAmount > 0) {
        for (let i = 0; i < obstacles.length; i++) {
            const obs = obstacles[i];
            if (obs.x > player.x && obs.x - player.x < blockSize * 5.5) {
                addFloatingText(player.x, 80, '☢️ 核彈自動觸發!', '#f59e0b');
                executeNukeBlast();
                break;
            }
        }
    }

    if (c4Mode === 'auto' && c4Amount > 0) {
        triggerC4Auto();
    }

    if (gunMode === 'auto' && gunAmount > 0) {
        triggerGunAuto();
    }

    // 1. 獎勵方塊撞擊與機率抽取
    for (let i = bonusCubes.length - 1; i >= 0; i--) {
        const bonus = bonusCubes[i];
        bonus.x -= currentSpeed * scaledDt;

        const isXOverlap = (player.x + blockSize > bonus.x && player.x < bonus.x + blockSize);
        if (isXOverlap && !bonus.collected) {
            const bonusTopY = bonus.layer * layerHeight;
            const bonusBottomY = (bonus.layer + 1) * layerHeight;

            for (let idx = 0; idx < player.cubeCount; idx++) {
                const pBoxTop = (player.currentVisualBottom - idx) * layerHeight;
                const pBoxBottom = (player.currentVisualBottom - idx + 1) * layerHeight;
                if (Math.min(pBoxBottom, bonusBottomY) - Math.max(pBoxTop, bonusTopY) > 5) {
                    bonus.collected = true;

                    // 依照權重抽取：[C4: 20], [核彈: 10], [槍: 3]
                    const awardedItem = rollRandomItem();

                    if (awardedItem === 'C4') {
                        c4Amount++;
                        addFloatingText(bonus.x, bonus.layer * layerHeight, '+1 C4 💣', '#38bdf8');
                    } else if (awardedItem === 'NUKE') {
                        nukeAmount++;
                        addFloatingText(bonus.x, bonus.layer * layerHeight, '+1 核彈 ☢️', '#f59e0b');
                    } else if (awardedItem === 'GUN') {
                        gunAmount++;
                        addFloatingText(bonus.x, bonus.layer * layerHeight, '+1 獵龍槍 🔫 (稀有!)', '#34d399');
                    }

                    updateItemsUI();
                    createExplosion(bonus.x, bonus.layer * layerHeight, '#fbbf24', 18);
                    break;
                }
            }
        }

        if (bonus.x < -blockSize * 2 || bonus.collected) {
            bonusCubes.splice(i, 1);
        }
    }

    // 2. 翼龍更新
    for (let i = pterodactyls.length - 1; i >= 0; i--) {
        const p = pterodactyls[i];
        p.x -= (currentSpeed + p.speedBonus) * scaledDt;

        p.wingTimer += scaledDt;
        if (p.wingTimer > 0.15) {
            p.wingUp = !p.wingUp;
            p.wingTimer = 0;
        }

        const hitPadding = 4;
        const isXOverlap = (player.x + blockSize - hitPadding > p.x && player.x + hitPadding < p.x + blockSize * 1.1);

        if (isXOverlap && !p.resolved) {
            const pTopY = p.layer * layerHeight;
            const pBottomY = (p.layer + 1) * layerHeight;

            let coreHit = false;
            let hitBodyIdx = -1;

            for (let idx = 0; idx < player.cubeCount; idx++) {
                const isCore = (idx === player.cubeCount - 1);
                const pBoxTop = (player.currentVisualBottom - idx) * layerHeight;
                const pBoxBottom = (player.currentVisualBottom - idx + 1) * layerHeight;

                if (Math.min(pBoxBottom, pBottomY) - Math.max(pBoxTop, pTopY) > 6) {
                    if (isCore) {
                        coreHit = true;
                        break;
                    } else {
                        hitBodyIdx = idx;
                    }
                }
            }

            if (coreHit) {
                const coreY = (player.currentVisualBottom - (player.cubeCount - 1)) * layerHeight;
                createExplosion(player.x, coreY, '#00f2fe');
                gameOver();
                return;
            }

            if (hitBodyIdx !== -1) {
                const py = (player.currentVisualBottom - hitBodyIdx) * layerHeight;
                createExplosion(player.x, py, '#f43f5e', 20);
                createExplosion(p.x, py, '#c084fc', 20);

                player.cubeCount = Math.max(1, player.cubeCount - 1);
                player.currentVisualBottom -= 1;
                player.hangTimer = 0.25;

                p.resolved = true;
                pterodactyls.splice(i, 1);
                continue;
            }
        }

        if (!p.cleared && p.x + blockSize < player.x) {
            p.cleared = true;
            score++;
        }

        if (p.x < -blockSize * 2) {
            pterodactyls.splice(i, 1);
        }
    }

    // 3. 障礙物碰撞
    const hitPadding = 3;
    let isCurrentlyOverlappingAnyObstacle = false;

    for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        const isXOverlap = (player.x + blockSize - hitPadding > obs.x && player.x + hitPadding < obs.x + blockSize);

        if (isXOverlap) {
            isCurrentlyOverlappingAnyObstacle = true;

            if (!obs.resolved) {
                let coreHit = false;
                let destroyedBodyIndices = [];

                for (let idx = 0; idx < player.cubeCount; idx++) {
                    const isCore = (idx === player.cubeCount - 1);
                    const pBoxTop = (player.currentVisualBottom - idx) * layerHeight;
                    const pBoxBottom = (player.currentVisualBottom - idx + 1) * layerHeight;

                    let hasCollidedWithObs = false;
                    for (let l of obs.layers) {
                        const obsTop = l * layerHeight;
                        const obsBottom = (l + 1) * layerHeight;
                        const overlapY = Math.min(pBoxBottom, obsBottom) - Math.max(pBoxTop, obsTop);
                        if (overlapY > 5) {
                            hasCollidedWithObs = true;
                            break;
                        }
                    }

                    if (hasCollidedWithObs) {
                        if (isCore) {
                            coreHit = true;
                            break;
                        } else {
                            destroyedBodyIndices.push(idx);
                        }
                    }
                }

                if (coreHit) {
                    const coreY = (player.currentVisualBottom - (player.cubeCount - 1)) * layerHeight;
                    createExplosion(player.x, coreY, '#00f2fe');
                    gameOver();
                    return;
                }

                if (destroyedBodyIndices.length > 0) {
                    for (let idx of destroyedBodyIndices) {
                        const py = (player.currentVisualBottom - idx) * layerHeight;
                        createExplosion(player.x, py, '#f43f5e');
                    }

                    const hitCount = destroyedBodyIndices.length;
                    player.cubeCount = Math.max(1, player.cubeCount - hitCount);
                    player.currentVisualBottom -= hitCount;
                    player.hangTimer = 0.25;
                }

                obs.resolved = true;
            }
        }

        if (!obs.cleared && obs.x + blockSize < player.x) {
            obs.cleared = true;
            score++;
        }

        if (obs.x < -blockSize * 2) {
            obstacles.splice(i, 1);
            i--;
        }

        obs.x -= currentSpeed * scaledDt;
    }

    // 4. 下墜
    if (!isCurrentlyOverlappingAnyObstacle) {
        if (player.hangTimer > 0) {
            player.hangTimer -= scaledDt;
        } else {
            const targetFloor = 9;
            if (player.currentVisualBottom < targetFloor) {
                player.currentVisualBottom += player.dropSpeed * scaledDt;
                if (player.currentVisualBottom > targetFloor) {
                    player.currentVisualBottom = targetFloor;
                }
            }
        }
    }

    // 5. 射擊彈道更新
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.alpha -= dt * 4.0;
        if (b.alpha <= 0) bullets.splice(i, 1);
    }

    // 6. 文字與粒子
    for (let i = floatTexts.length - 1; i >= 0; i--) {
        const ft = floatTexts[i];
        ft.y += ft.vy * dt;
        ft.alpha -= dt * 1.5;
        if (ft.alpha <= 0) floatTexts.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.alpha -= dt / p.life;
        if (p.alpha <= 0) particles.splice(i, 1);
    }

    if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 2.5);
}

// 繪製翼龍
function drawPterodactyl(x, y, size, wingUp) {
    ctx.save();
    ctx.translate(x, y);

    ctx.strokeStyle = 'rgba(192, 132, 252, 0.7)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(-2, -2, size * 1.15, size + 4);
    ctx.setLineDash([]);

    ctx.fillStyle = '#e2e8f0';
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 1.5;

    const w = size;
    const h = size;

    ctx.fillRect(w * 0.35, h * 0.42, w * 0.35, h * 0.22);
    ctx.fillRect(w * 0.12, h * 0.36, w * 0.25, h * 0.18);

    ctx.beginPath();
    ctx.moveTo(w * 0.12, h * 0.45);
    ctx.lineTo(w * 0.0, h * 0.5);
    ctx.lineTo(w * 0.12, h * 0.54);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(w * 0.35, h * 0.36);
    ctx.lineTo(w * 0.55, h * 0.25);
    ctx.lineTo(w * 0.35, h * 0.45);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#0f172a';
    ctx.fillRect(w * 0.18, h * 0.38, w * 0.06, h * 0.06);
    ctx.fillStyle = '#e2e8f0';

    ctx.beginPath();
    if (wingUp) {
        ctx.moveTo(w * 0.4, h * 0.42);
        ctx.lineTo(w * 0.45, h * 0.05);
        ctx.lineTo(w * 0.65, h * 0.15);
        ctx.lineTo(w * 0.58, h * 0.42);
    } else {
        ctx.moveTo(w * 0.4, h * 0.55);
        ctx.lineTo(w * 0.48, h * 0.95);
        ctx.lineTo(w * 0.68, h * 0.82);
        ctx.lineTo(w * 0.6, h * 0.55);
    }
    ctx.closePath();
    ctx.fill();

    ctx.fillRect(w * 0.7, h * 0.46, w * 0.18, h * 0.12);

    ctx.restore();
}

function draw2DBlock(x, y, size, type) {
    const pad = 1.5;
    const bx = x + pad;
    const by = y + pad;
    const bs = size - pad * 2;

    if (type === 'core') {
        ctx.fillStyle = '#0ea5e9';
        ctx.fillRect(bx, by, bs, bs);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(bx, by, bs, bs);

        ctx.fillStyle = '#ffffff';
        const eyeSize = bs * 0.22;
        ctx.fillRect(bx + bs * 0.6, by + bs * 0.28, eyeSize, eyeSize);
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(bx + bs * 0.68, by + bs * 0.32, eyeSize * 0.55, eyeSize * 0.55);

    } else if (type === 'body') {
        ctx.fillStyle = '#4f46e5';
        ctx.fillRect(bx, by, bs, bs);
        ctx.strokeStyle = '#818cf8';
        ctx.lineWidth = 2;
        ctx.strokeRect(bx, by, bs, bs);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.fillRect(bx + bs * 0.25, by + bs * 0.25, bs * 0.5, bs * 0.5);

    } else if (type === 'obstacle') {
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(bx, by, bs, bs);
        ctx.strokeStyle = isAimingC4 ? '#fef08a' : '#f87171';
        ctx.lineWidth = isAimingC4 ? 3 : 2;
        ctx.strokeRect(bx, by, bs, bs);

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        const m = bs * 0.28;
        ctx.moveTo(bx + m, by + m);
        ctx.lineTo(bx + bs - m, by + bs - m);
        ctx.moveTo(bx + bs - m, by + m);
        ctx.lineTo(bx + m, by + bs - m);
        ctx.stroke();

    } else if (type === 'bonus') {
        // 金色閃爍問號獎勵方塊
        const glow = Math.sin(performance.now() * 0.008) * 0.2 + 0.8;
        ctx.fillStyle = `rgba(245, 158, 11, ${glow})`;
        ctx.fillRect(bx, by, bs, bs);
        ctx.strokeStyle = '#fef08a';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(bx, by, bs, bs);

        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${bs * 0.65}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('？', bx + bs / 2, by + bs / 2);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 跑道背景
    for (let i = 0; i < LAYERS; i++) {
        const y = i * layerHeight;
        ctx.fillStyle = (i % 2 === 0) ? '#111c33' : '#0c1324';
        ctx.fillRect(0, y, canvas.width, layerHeight);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
        ctx.font = 'bold 11px monospace';
        ctx.fillText(`L${10 - i}`, 8, y + layerHeight * 0.6);
    }

    // 2. 問號獎勵方塊
    bonusCubes.forEach(b => {
        draw2DBlock(b.x, b.layer * layerHeight, blockSize, 'bonus');
    });

    // 3. 障礙物方塊
    obstacles.forEach(obs => {
        obs.layers.forEach(l => {
            draw2DBlock(obs.x, l * layerHeight, blockSize, 'obstacle');
        });
    });

    // 4. 翼龍怪物
    pterodactyls.forEach(p => {
        drawPterodactyl(p.x, p.layer * layerHeight, blockSize, p.wingUp);
    });

    // 5. 玩家方塊
    const visualBottomY = player.currentVisualBottom * layerHeight;
    for (let i = 0; i < player.cubeCount; i++) {
        const y = visualBottomY - (i * layerHeight);
        const isCore = (i === player.cubeCount - 1);
        draw2DBlock(player.x, y, blockSize, isCore ? 'core' : 'body');
    }

    // 6. 射擊穿甲光束
    bullets.forEach(b => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, b.alpha);
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 4;
        ctx.shadowColor = '#10b981';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(b.x1, b.y1);
        ctx.lineTo(b.x2, b.y2);
        ctx.stroke();
        ctx.restore();
    });

    // 7. 粒子
    particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.restore();
    });

    // 8. 浮動文字
    floatTexts.forEach(ft => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
    });

    // 9. 核彈白光
    if (flashAlpha > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // 10. 暫停畫面覆蓋
    if (isPaused) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = '#00f2fe';
        ctx.shadowBlur = 15;
        ctx.fillText('⏸️ 遊戲暫停', canvas.width / 2, canvas.height / 2);
        ctx.shadowBlur = 0;
    }
}

function gameOver() {
    gameState = 'GAMEOVER';
    isAimingC4 = false;
    isPaused = false;
    pauseBtn.classList.add('hidden');
    updateItemsUI();

    const mins = Math.floor(elapsedTime / 60);
    const secs = (elapsedTime % 60).toFixed(1);
    const timeStr = `${String(mins).padStart(2, '0')}:${secs.padStart(4, '0')}`;
    gameOverStats.innerHTML = `存活時間：<b>${timeStr}</b> &nbsp;|&nbsp; 通過障礙：<b>${score}</b>`;
    gameOverOverlay.classList.remove('hidden');
}

function gameLoop(timestamp) {
    if (!lastFrameTime) lastFrameTime = timestamp;
    const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.1);
    lastFrameTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
