<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>立體方塊跑酷 - 道具強化精準版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: manipulation;
        }
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 900px;
            height: 100vh;
            max-height: 600px;
            background: #0f172a;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #1e293b;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(11, 15, 25, 0.88);
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        .overlay.hidden {
            display: none;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
            text-align: center;
        }
        p.subtitle {
            color: #94a3b8;
            margin-bottom: 24px;
            font-size: 0.95rem;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 2px solid #334155;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }
        .btn.active {
            background: #0284c7;
            border-color: #38bdf8;
            color: #ffffff;
        }
        .start-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none;
            padding: 14px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.5);
            transition: 0.2s;
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(37, 99, 235, 0.7);
        }

        /* 左上角 HUD */
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            z-index: 5;
            pointer-events: none;
            font-family: monospace;
        }
        .hud-item {
            font-size: 1.15rem;
            font-weight: bold;
            color: #f8fafc;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 4px;
        }
        .hud-item span {
            color: #38bdf8;
        }

        /* 右上角暫停按鈕 */
        #pauseBtn {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 12;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #334155;
            color: #f8fafc;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #pauseBtn:hover {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
            transform: scale(1.03);
        }
        #pauseBtn.paused {
            background: #0284c7;
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.7);
        }
        #pauseBtn.hidden {
            display: none;
        }

        /* 道具欄 (右下角操作按鈕) */
        #item-bar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 5;
        }
        .item-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #334155;
            color: #94a3b8;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }
        .item-btn.has-item {
            border-color: #f59e0b;
            color: #f8fafc;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.35);
        }
        .item-btn.nuke.has-item {
            border-color: #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.35);
        }
        .item-btn.aiming {
            border-color: #38bdf8;
            background: #0369a1;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
            animation: pulse 0.8s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
        .item-btn:active {
            transform: scale(0.95);
        }
        .item-count {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        #aim-banner {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(2, 132, 199, 0.9);
            color: white;
            padding: 8px 24px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 0 20px rgba(2, 132, 199, 0.6);
            display: none;
            z-index: 6;
            pointer-events: none;
        }
        #mobile-tip {
            position: absolute;
            bottom: 12px;
            left: 20px;
            font-size: 0.8rem;
            color: #64748b;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- 左上角時間與過關數 -->
    <div id="hud">
        <div class="hud-item">時間：<span id="timeDisplay">00:00.0</span></div>
        <div class="hud-item">過關數：<span id="scoreDisplay">0</span></div>
    </div>

    <!-- 右上角暫停/繼續按鈕 -->
    <button id="pauseBtn" class="hidden" onclick="togglePause(event)">
        <span id="pauseBtnText">⏸️ 暫停</span>
    </button>

    <!-- C4 瞄準提示 -->
    <div id="aim-banner">💣 點擊任意紅色障礙物將其引爆！</div>

    <!-- 道具按鈕區 -->
    <div id="item-bar">
        <button class="item-btn" id="btnC4" onclick="toggleC4Aim(event)">
            <span>💣 C4 [1]</span>
            <span class="item-count" id="c4Count">0</span>
        </button>
        <button class="item-btn nuke" id="btnNuke" onclick="useNuke(event)">
            <span>☢️ 核彈 [2]</span>
            <span class="item-count" id="nukeCount">0</span>
        </button>
    </div>

    <div id="mobile-tip">空白鍵 (Space) 或 點擊墊高 | P 鍵暫停</div>

    <!-- 起始畫面 -->
    <div id="startOverlay" class="overlay">
        <h1>2D 精準分層跑酷</h1>
        <p class="subtitle">
            精準判定機制：<b>沒撞到障礙物的方塊絕對不被消除！</b><br>
            撞擊<b>金色獎勵方塊★</b>獲取 C4 與核彈道具。
        </p>
        <div style="margin-bottom: 8px; color: #cbd5e1; font-size: 0.9rem;">請選擇遊戲難度：</div>
        <div class="btn-group">
            <button class="btn" onclick="selectDifficulty('easy')">簡單</button>
            <button class="btn active" onclick="selectDifficulty('normal')">普通</button>
            <button class="btn" onclick="selectDifficulty('hard')">困難</button>
        </div>
        <button class="start-btn" onclick="startGame()">開始遊戲</button>
    </div>

    <!-- 結算畫面 -->
    <div id="gameOverOverlay" class="overlay hidden">
        <h1 style="background: linear-gradient(135deg, #ff416c, #ff4b2b); -webkit-background-clip: text;">挑戰結束</h1>
        <p class="subtitle" id="gameOverStats">存活時間：00:00.0 | 通過障礙：0</p>
        <button class="start-btn" onclick="startGame()">再玩一次</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const timeDisplay = document.getElementById('timeDisplay');
const scoreDisplay = document.getElementById('scoreDisplay');
const startOverlay = document.getElementById('startOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const gameOverStats = document.getElementById('gameOverStats');
const c4CountDisplay = document.getElementById('c4Count');
const nukeCountDisplay = document.getElementById('nukeCount');
const btnC4 = document.getElementById('btnC4');
const btnNuke = document.getElementById('btnNuke');
const aimBanner = document.getElementById('aim-banner');
const pauseBtn = document.getElementById('pauseBtn');
const pauseBtnText = document.getElementById('pauseBtnText');

const LAYERS = 10;
let layerHeight = 0;
let blockSize = 0;

let currentDifficulty = 'normal';
const DIFFICULTY_CONFIG = {
    easy: { baseSpeed: 230, maxBlocks: 6, interval: 2.3, growRate: 20 },
    normal: { baseSpeed: 280, maxBlocks: 7, interval: 1.9, growRate: 15 },
    hard: { baseSpeed: 350, maxBlocks: 8, interval: 1.6, growRate: 10 }
};

let gameState = 'MENU';
let isPaused = false; // 暫停狀態
let elapsedTime = 0;
let score = 0;
let obstacleIdCounter = 0;

let c4Amount = 0;
let nukeAmount = 0;
let isAimingC4 = false;

const player = {
    x: 0,
    currentVisualBottom: 9,
    cubeCount: 1,
    dropSpeed: 6.0,
    hangTimer: 0
};

let obstacles = [];
let bonusCubes = [];
let particles = [];
let nextObstacleTime = 0;
let nextBonusTime = 0;
let lastFrameTime = 0;
let flashAlpha = 0;

function resizeCanvas() {
    const container = document.getElementById('game-container');
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
    layerHeight = canvas.height / LAYERS;
    blockSize = layerHeight;
    player.x = canvas.width * 0.18;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function selectDifficulty(diff) {
    currentDifficulty = diff;
    document.querySelectorAll('.btn-group .btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(
            diff === 'easy' ? '簡單' : diff === 'normal' ? '普通' : '困難'
        ));
    });
}

function updateItemsUI() {
    c4CountDisplay.textContent = c4Amount;
    nukeCountDisplay.textContent = nukeAmount;
    btnC4.classList.toggle('has-item', c4Amount > 0);
    btnNuke.classList.toggle('has-item', nukeAmount > 0);
    btnC4.classList.toggle('aiming', isAimingC4);
    aimBanner.style.display = isAimingC4 ? 'block' : 'none';
}

// 暫停切換邏輯
function togglePause(e) {
    if (e) e.stopPropagation();
    if (gameState !== 'PLAYING') return;

    isPaused = !isPaused;

    if (isPaused) {
        pauseBtnText.textContent = '▶️ 繼續';
        pauseBtn.classList.add('paused');
        if (isAimingC4) {
            isAimingC4 = false;
            updateItemsUI();
        }
    } else {
        pauseBtnText.textContent = '⏸️ 暫停';
        pauseBtn.classList.remove('paused');
        lastFrameTime = performance.now(); // 防止恢復時跳幀
    }
}

function startGame() {
    startOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    
    isPaused = false;
    pauseBtn.classList.remove('hidden', 'paused');
    pauseBtnText.textContent = '⏸️ 暫停';

    player.cubeCount = 1;
    player.currentVisualBottom = 9;
    player.hangTimer = 0;
    
    obstacles = [];
    bonusCubes = [];
    particles = [];
    score = 0;
    elapsedTime = 0;
    obstacleIdCounter = 0;
    
    c4Amount = 1;
    nukeAmount = 0;
    isAimingC4 = false;
    updateItemsUI();

    lastFrameTime = performance.now();
    nextObstacleTime = 1.2;
    nextBonusTime = 3.5;
    gameState = 'PLAYING';
}

function addPlayerCube() {
    if (gameState !== 'PLAYING' || isPaused) return;
    const currentCoreLayer = player.currentVisualBottom - player.cubeCount + 1;
    if (currentCoreLayer <= 0.05 || player.cubeCount >= LAYERS) return;

    player.cubeCount++;
    createAddEffect(player.x, (currentCoreLayer - 1) * layerHeight);
}

function toggleC4Aim(e) {
    if (e) e.stopPropagation();
    if (gameState !== 'PLAYING' || isPaused || c4Amount <= 0) return;
    isAimingC4 = !isAimingC4;
    updateItemsUI();
}

function useNuke(e) {
    if (e) e.stopPropagation();
    if (gameState !== 'PLAYING' || isPaused || nukeAmount <= 0) return;

    let targetIndex = -1;
    let minDistance = Infinity;
    for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        if (obs.x + blockSize > player.x && obs.x < minDistance) {
            minDistance = obs.x;
            targetIndex = i;
        }
    }

    if (targetIndex !== -1) {
        nukeAmount--;
        updateItemsUI();

        const targetObs = obstacles[targetIndex];
        targetObs.layers.forEach(layer => {
            createExplosion(targetObs.x, layer * layerHeight, '#f59e0b', 24);
        });
        obstacles.splice(targetIndex, 1);
        score++;
        flashAlpha = 0.85;
    }
}

// 點擊事件監聽
canvas.addEventListener('pointerdown', (e) => {
    if (gameState !== 'PLAYING' || isPaused) return;

    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;
    const clickedLayer = Math.floor(clickY / layerHeight);

    let hitObstacle = false;
    for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        if (clickX >= obs.x && clickX <= obs.x + blockSize && obs.layers.has(clickedLayer)) {
            if (c4Amount > 0) {
                c4Amount--;
                obs.layers.delete(clickedLayer);
                createExplosion(obs.x, clickedLayer * layerHeight, '#38bdf8', 25);
                hitObstacle = true;
                isAimingC4 = false;
                updateItemsUI();
                break;
            }
        }
    }

    if (!hitObstacle && !isAimingC4) {
        addPlayerCube();
    } else if (isAimingC4 && !hitObstacle) {
        isAimingC4 = false;
        updateItemsUI();
    }
});

// 鍵盤監聽
window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyP' || e.code === 'Escape') {
        e.preventDefault();
        togglePause();
        return;
    }

    if (isPaused) return; // 暫停時鎖定其餘按鍵操作

    if (e.code === 'Space') {
        e.preventDefault();
        if (gameState === 'PLAYING') {
            if (isAimingC4) isAimingC4 = false;
            addPlayerCube();
        } else if (gameState === 'GAMEOVER') {
            startGame();
        }
    } else if (e.code === 'Digit1' || e.code === 'KeyC') {
        toggleC4Aim();
    } else if (e.code === 'Digit2' || e.code === 'KeyN') {
        useNuke();
    }
});

function spawnBonusCube() {
    const layer = Math.floor(Math.random() * LAYERS);
    bonusCubes.push({
        x: canvas.width + 30,
        layer: layer,
        type: Math.random() < 0.65 ? 'C4' : 'NUKE',
        collected: false
    });
}

function spawnObstacle() {
    const config = DIFFICULTY_CONFIG[currentDifficulty];
    const timeGrown = Math.floor(elapsedTime / config.growRate);
    const targetBlocks = Math.min(config.maxBlocks, Math.max(2, 2 + timeGrown));

    const layers = Array.from({ length: LAYERS }, (_, i) => i);
    const safeLayer = Math.floor(Math.random() * LAYERS);
    const dangerCandidates = layers.filter(l => l !== safeLayer);
    dangerCandidates.sort(() => Math.random() - 0.5);

    const obstacleLayers = dangerCandidates.slice(0, targetBlocks);

    obstacles.push({
        id: ++obstacleIdCounter,
        x: canvas.width + 20,
        layers: new Set(obstacleLayers),
        cleared: false,
        resolved: false
    });
}

function createExplosion(x, y, color, count = 14) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x + blockSize / 2,
            y: y + layerHeight / 2,
            vx: (Math.random() - 0.5) * 360,
            vy: (Math.random() - 0.5) * 360,
            size: Math.random() * 6 + 3,
            color: color,
            alpha: 1,
            life: 0.45
        });
    }
}

function createAddEffect(x, y) {
    for (let i = 0; i < 4; i++) {
        particles.push({
            x: x + Math.random() * blockSize,
            y: y + layerHeight,
            vx: (Math.random() - 0.5) * 40,
            vy: -Math.random() * 80 - 20,
            size: 3,
            color: '#38bdf8',
            alpha: 0.9,
            life: 0.3
        });
    }
}

let floatTexts = [];
function addFloatingText(x, y, text, color) {
    floatTexts.push({ x, y, text, color, alpha: 1, vy: -50 });
}

function update(dt) {
    if (gameState !== 'PLAYING' || isPaused) return;

    const timeScale = isAimingC4 ? 0.25 : 1.0;
    const scaledDt = dt * timeScale;

    elapsedTime += scaledDt;
    const config = DIFFICULTY_CONFIG[currentDifficulty];
    const currentSpeed = config.baseSpeed + elapsedTime * 2.2;

    const mins = Math.floor(elapsedTime / 60);
    const secs = (elapsedTime % 60).toFixed(1);
    timeDisplay.textContent = `${String(mins).padStart(2, '0')}:${secs.padStart(4, '0')}`;
    scoreDisplay.textContent = score;

    nextObstacleTime -= scaledDt;
    if (nextObstacleTime <= 0) {
        spawnObstacle();
        nextObstacleTime = config.interval * (0.85 + Math.random() * 0.35);
    }

    nextBonusTime -= scaledDt;
    if (nextBonusTime <= 0) {
        spawnBonusCube();
        nextBonusTime = 6.0 + Math.random() * 4.0;
    }

    // 1. 獎勵方塊收集
    for (let i = bonusCubes.length - 1; i >= 0; i--) {
        const bonus = bonusCubes[i];
        bonus.x -= currentSpeed * scaledDt;

        const isXOverlap = (player.x + blockSize > bonus.x && player.x < bonus.x + blockSize);
        if (isXOverlap && !bonus.collected) {
            const bonusTopY = bonus.layer * layerHeight;
            const bonusBottomY = (bonus.layer + 1) * layerHeight;

            for (let idx = 0; idx < player.cubeCount; idx++) {
                const pBoxTop = (player.currentVisualBottom - idx) * layerHeight;
                const pBoxBottom = (player.currentVisualBottom - idx + 1) * layerHeight;
                if (Math.min(pBoxBottom, bonusBottomY) - Math.max(pBoxTop, bonusTopY) > 5) {
                    bonus.collected = true;
                    if (bonus.type === 'C4') {
                        c4Amount++;
                        addFloatingText(bonus.x, bonus.layer * layerHeight, '+1 C4 💣', '#38bdf8');
                    } else {
                        nukeAmount++;
                        addFloatingText(bonus.x, bonus.layer * layerHeight, '+1 核彈 ☢️', '#f59e0b');
                    }
                    updateItemsUI();
                    createExplosion(bonus.x, bonus.layer * layerHeight, '#fbbf24', 18);
                    break;
                }
            }
        }

        if (bonus.x < -blockSize * 2 || bonus.collected) {
            bonusCubes.splice(i, 1);
        }
    }

    // 2. 障礙物碰撞與點對點精確消塊
    const hitPadding = 3;
    let isCurrentlyOverlappingAnyObstacle = false;

    for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        const isXOverlap = (player.x + blockSize - hitPadding > obs.x && player.x + hitPadding < obs.x + blockSize);

        if (isXOverlap) {
            isCurrentlyOverlappingAnyObstacle = true;

            if (!obs.resolved) {
                let coreHit = false;
                let destroyedBodyIndices = [];

                for (let idx = 0; idx < player.cubeCount; idx++) {
                    const isCore = (idx === player.cubeCount - 1);
                    const pBoxTop = (player.currentVisualBottom - idx) * layerHeight;
                    const pBoxBottom = (player.currentVisualBottom - idx + 1) * layerHeight;

                    let hasCollidedWithObs = false;
                    for (let l of obs.layers) {
                        const obsTop = l * layerHeight;
                        const obsBottom = (l + 1) * layerHeight;
                        const overlapY = Math.min(pBoxBottom, obsBottom) - Math.max(pBoxTop, obsTop);
                        if (overlapY > 5) {
                            hasCollidedWithObs = true;
                            break;
                        }
                    }

                    if (hasCollidedWithObs) {
                        if (isCore) {
                            coreHit = true;
                            break;
                        } else {
                            destroyedBodyIndices.push(idx);
                        }
                    }
                }

                if (coreHit) {
                    const coreY = (player.currentVisualBottom - (player.cubeCount - 1)) * layerHeight;
                    createExplosion(player.x, coreY, '#00f2fe');
                    gameOver();
                    return;
                }

                if (destroyedBodyIndices.length > 0) {
                    for (let idx of destroyedBodyIndices) {
                        const py = (player.currentVisualBottom - idx) * layerHeight;
                        createExplosion(player.x, py, '#f43f5e');
                    }

                    const hitCount = destroyedBodyIndices.length;
                    player.cubeCount = Math.max(1, player.cubeCount - hitCount);
                    player.currentVisualBottom -= hitCount;
                    player.hangTimer = 0.25;
                }

                obs.resolved = true;
            }
        }

        if (!obs.cleared && obs.x + blockSize < player.x) {
            obs.cleared = true;
            score++;
        }

        if (obs.x < -blockSize * 2) {
            obstacles.splice(i, 1);
            i--;
        }

        obs.x -= currentSpeed * scaledDt;
    }

    // 3. 離開障礙物後平穩向下墜落
    if (!isCurrentlyOverlappingAnyObstacle) {
        if (player.hangTimer > 0) {
            player.hangTimer -= scaledDt;
        } else {
            const targetFloor = 9;
            if (player.currentVisualBottom < targetFloor) {
                player.currentVisualBottom += player.dropSpeed * scaledDt;
                if (player.currentVisualBottom > targetFloor) {
                    player.currentVisualBottom = targetFloor;
                }
            }
        }
    }

    // 4. 文字與粒子更新
    for (let i = floatTexts.length - 1; i >= 0; i--) {
        const ft = floatTexts[i];
        ft.y += ft.vy * dt;
        ft.alpha -= dt * 1.5;
        if (ft.alpha <= 0) floatTexts.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.alpha -= dt / p.life;
        if (p.alpha <= 0) particles.splice(i, 1);
    }

    if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 2.5);
}

function draw2DBlock(x, y, size, type, extraData) {
    const pad = 1.5;
    const bx = x + pad;
    const by = y + pad;
    const bs = size - pad * 2;

    if (type === 'core') {
        ctx.fillStyle = '#0ea5e9';
        ctx.fillRect(bx, by, bs, bs);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(bx, by, bs, bs);

        ctx.fillStyle = '#ffffff';
        const eyeSize = bs * 0.22;
        ctx.fillRect(bx + bs * 0.6, by + bs * 0.28, eyeSize, eyeSize);
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(bx + bs * 0.68, by + bs * 0.32, eyeSize * 0.55, eyeSize * 0.55);

    } else if (type === 'body') {
        ctx.fillStyle = '#4f46e5';
        ctx.fillRect(bx, by, bs, bs);
        ctx.strokeStyle = '#818cf8';
        ctx.lineWidth = 2;
        ctx.strokeRect(bx, by, bs, bs);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.fillRect(bx + bs * 0.25, by + bs * 0.25, bs * 0.5, bs * 0.5);

    } else if (type === 'obstacle') {
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(bx, by, bs, bs);
        ctx.strokeStyle = isAimingC4 ? '#fef08a' : '#f87171';
        ctx.lineWidth = isAimingC4 ? 3 : 2;
        ctx.strokeRect(bx, by, bs, bs);

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        const m = bs * 0.28;
        ctx.moveTo(bx + m, by + m);
        ctx.lineTo(bx + bs - m, by + bs - m);
        ctx.moveTo(bx + bs - m, by + m);
        ctx.lineTo(bx + m, by + bs - m);
        ctx.stroke();

    } else if (type === 'bonus') {
        const glow = Math.sin(performance.now() * 0.008) * 0.2 + 0.8;
        ctx.fillStyle = `rgba(245, 158, 11, ${glow})`;
        ctx.fillRect(bx, by, bs, bs);
        ctx.strokeStyle = '#fef08a';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(bx, by, bs, bs);

        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${bs * 0.55}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(extraData === 'C4' ? '💣' : '☢️', bx + bs / 2, by + bs / 2);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 跑道背景
    for (let i = 0; i < LAYERS; i++) {
        const y = i * layerHeight;
        ctx.fillStyle = (i % 2 === 0) ? '#111c33' : '#0c1324';
        ctx.fillRect(0, y, canvas.width, layerHeight);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
        ctx.font = 'bold 11px monospace';
        ctx.fillText(`L${10 - i}`, 8, y + layerHeight * 0.6);
    }

    // 2. 獎勵方塊
    bonusCubes.forEach(b => {
        draw2DBlock(b.x, b.layer * layerHeight, blockSize, 'bonus', b.type);
    });

    // 3. 障礙物方塊
    obstacles.forEach(obs => {
        obs.layers.forEach(l => {
            draw2DBlock(obs.x, l * layerHeight, blockSize, 'obstacle');
        });
    });

    // 4. 玩家方塊
    const visualBottomY = player.currentVisualBottom * layerHeight;
    for (let i = 0; i < player.cubeCount; i++) {
        const y = visualBottomY - (i * layerHeight);
        const isCore = (i === player.cubeCount - 1);
        draw2DBlock(player.x, y, blockSize, isCore ? 'core' : 'body');
    }

    // 5. 粒子
    particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.restore();
    });

    // 6. 浮動文字
    floatTexts.forEach(ft => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
    });

    // 7. 核彈全螢幕白光
    if (flashAlpha > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // 8. 暫停畫面覆蓋標記
    if (isPaused) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = '#00f2fe';
        ctx.shadowBlur = 15;
        ctx.fillText('⏸️ 遊戲暫停', canvas.width / 2, canvas.height / 2);
        ctx.shadowBlur = 0;
    }
}

function gameOver() {
    gameState = 'GAMEOVER';
    isAimingC4 = false;
    isPaused = false;
    pauseBtn.classList.add('hidden');
    updateItemsUI();

    const mins = Math.floor(elapsedTime / 60);
    const secs = (elapsedTime % 60).toFixed(1);
    const timeStr = `${String(mins).padStart(2, '0')}:${secs.padStart(4, '0')}`;
    gameOverStats.innerHTML = `存活時間：<b>${timeStr}</b> &nbsp;|&nbsp; 通過障礙：<b>${score}</b>`;
    gameOverOverlay.classList.remove('hidden');
}

function gameLoop(timestamp) {
    if (!lastFrameTime) lastFrameTime = timestamp;
    const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.1);
    lastFrameTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
